<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HistoryX — Clear site history</title>
  <link rel="stylesheet" href="page.css">
</head>
<body>
  <div class="wrap" style="max-width:640px">
    <header class="topbar">
      <div class="brand">
        <img src="../assets/icons/icon48.png" alt="" >
        <div>
          <h1>Clear site history</h1>
          <span class="brand-sub">HISTORYX · BY CINEFYLK</span>
        </div>
      </div>
    </header>

    <section class="card">
      <div class="card-head">
        <div>
          <h2 id="siteName">Loading…</h2>
          <p id="siteSummary">Reading your history cache.</p>
        </div>
        <button id="selectAllBtn" class="btn small" type="button">Deselect all</button>
      </div>

      <div id="urlList" class="rule-list" style="max-height:340px;overflow-y:auto"></div>

      <div class="field" style="margin-top:14px">
        <label class="toggle">
          <input id="addToList" type="checkbox">
          <span class="toggle-track"></span> Also add this domain to my HistoryX list
        </label>
      </div>

      <div class="actions">
        <button id="clearBtn" class="btn danger" type="button" disabled>Clear selected history</button>
        <button id="cancelBtn" class="btn" type="button">Cancel</button>
      </div>
      <p id="result" class="hint"></p>
      <p class="note" style="margin-top:12px">This removes the selected URLs from Chrome history. Cookies, cache and site data are not touched. Restore is available in the extension popup.</p>
    </section>
  </div>

  <script type="module" src="confirm.js"></script>
</body>
</html>
