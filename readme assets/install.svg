<svg xmlns="http://www.w3.org/2000/svg" width="800" height="520" viewBox="0 0 800 520">
  <style>
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
    .txt { font-family: Inter, system-ui, -apple-system, sans-serif; }
    .head, .row { animation: fadeUp 12s ease-out infinite; }
    .r2 { animation-delay: .25s; }
    .r3 { animation-delay: .5s; }
    .r4 { animation-delay: .75s; }
    .r5 { animation-delay: 1s; }
    .r6 { animation-delay: 1.25s; }
    .row:hover .panel { stroke: #dc2626; }
    .row:hover .num { fill: #f7f7fb; color: #0d0d10; }
    @keyframes fadeUp {
      0%, 5% { opacity: 0; transform: translateY(10px); }
      15%, 90% { opacity: 1; transform: translateY(0); }
      100% { opacity: 0; transform: translateY(0); }
    }
  </style>
  <rect width="800" height="520" rx="14" fill="#0d0d10"/>
  <g class="head">
    <text class="mono" x="40" y="46" fill="#dc2626" font-size="12" letter-spacing="3">INSTALLATION</text>
    <text class="txt" x="40" y="78" fill="#f7f7fb" font-size="23" font-weight="700">Google Chrome · about 60 seconds</text>
  </g>

  <g class="row">
    <rect class="panel" x="40" y="106" width="340" height="108" rx="11" fill="#171a21" stroke="#2b313e"/>
    <circle class="num" cx="70" cy="138" r="15" fill="#dc2626"/>
    <text class="mono" x="70" y="142" text-anchor="middle" fill="#fff" font-size="10">1</text>
    <text class="txt" x="96" y="135" fill="#f7f7fb" font-size="14" font-weight="650">Extract the folder</text>
    <text class="txt" x="60" y="166" fill="#a5a5b3" font-size="11.5">Unzip HistoryX and keep the folder</text>
    <text class="txt" x="60" y="186" fill="#a5a5b3" font-size="11.5">that contains manifest.json intact.</text>
  </g>

  <g class="row r2">
    <rect class="panel" x="420" y="106" width="340" height="108" rx="11" fill="#171a21" stroke="#2b313e"/>
    <circle class="num" cx="450" cy="138" r="15" fill="#dc2626"/>
    <text class="mono" x="450" y="142" text-anchor="middle" fill="#fff" font-size="10">2</text>
    <text class="txt" x="476" y="135" fill="#f7f7fb" font-size="14" font-weight="650">Open the extensions page</text>
    <text class="txt" x="440" y="166" fill="#a5a5b3" font-size="11.5">Navigate to chrome://extensions</text>
    <text class="txt" x="440" y="186" fill="#a5a5b3" font-size="11.5">in a new Chrome tab.</text>
  </g>

  <g class="row r3">
    <rect class="panel" x="40" y="236" width="340" height="108" rx="11" fill="#171a21" stroke="#2b313e"/>
    <circle class="num" cx="70" cy="268" r="15" fill="#dc2626"/>
    <text class="mono" x="70" y="272" text-anchor="middle" fill="#fff" font-size="10">3</text>
    <text class="txt" x="96" y="265" fill="#f7f7fb" font-size="14" font-weight="650">Developer mode</text>
    <text class="txt" x="60" y="296" fill="#a5a5b3" font-size="11.5">Flip the Developer mode switch</text>
    <text class="txt" x="60" y="316" fill="#a5a5b3" font-size="11.5">in the top-right corner.</text>
  </g>

  <g class="row r4">
    <rect class="panel" x="420" y="236" width="340" height="108" rx="11" fill="#171a21" stroke="#2b313e"/>
    <circle class="num" cx="450" cy="268" r="15" fill="#dc2626"/>
    <text class="mono" x="450" y="272" text-anchor="middle" fill="#fff" font-size="10">4</text>
    <text class="txt" x="476" y="265" fill="#f7f7fb" font-size="14" font-weight="650">Load unpacked</text>
    <text class="txt" x="440" y="296" fill="#a5a5b3" font-size="11.5">Click Load unpacked, then select</text>
    <text class="txt" x="440" y="316" fill="#a5a5b3" font-size="11.5">the HistoryX folder.</text>
  </g>

  <g class="row r5">
    <rect class="panel" x="40" y="366" width="340" height="108" rx="11" fill="#171a21" stroke="#2b313e"/>
    <circle class="num" cx="70" cy="398" r="15" fill="#dc2626"/>
    <text class="mono" x="70" y="402" text-anchor="middle" fill="#fff" font-size="10">5</text>
    <text class="txt" x="96" y="395" fill="#f7f7fb" font-size="14" font-weight="650">Pin the extension</text>
    <text class="txt" x="60" y="426" fill="#a5a5b3" font-size="11.5">Pin HistoryX from Chrome's</text>
    <text class="txt" x="60" y="446" fill="#a5a5b3" font-size="11.5">Extensions menu for quick access.</text>
  </g>

  <g class="row r6">
    <rect class="panel" x="420" y="366" width="340" height="108" rx="11" fill="#171a21" stroke="#2b313e"/>
    <circle class="num" cx="450" cy="398" r="15" fill="#dc2626"/>
    <text class="mono" x="450" y="402" text-anchor="middle" fill="#fff" font-size="10">6</text>
    <text class="txt" x="476" y="395" fill="#f7f7fb" font-size="14" font-weight="650">Reload after updates</text>
    <text class="txt" x="440" y="426" fill="#a5a5b3" font-size="11.5">Click the reload icon on the</text>
    <text class="txt" x="440" y="446" fill="#a5a5b3" font-size="11.5">extension card.</text>
  </g>
</svg>
