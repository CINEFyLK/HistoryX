<svg xmlns="http://www.w3.org/2000/svg" width="800" height="110" viewBox="0 0 800 110">
  <style>
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
    .p { animation: pop 12s ease-out infinite; }
    .p2 { animation-delay: .25s; }
    .p3 { animation-delay: .5s; }
    .p4 { animation-delay: .75s; }
    .p5 { animation-delay: 1s; }
    .dot { animation: pulse 2.4s ease-in-out infinite; }
    @keyframes pop {
      0%, 4% { opacity: 0; transform: translateY(10px); }
      14%, 90% { opacity: 1; transform: translateY(0); }
      100% { opacity: 0; transform: translateY(0); }
    }
    @keyframes pulse { 0%, 100% { opacity: .4; } 50% { opacity: 1; } }
  </style>
  <rect width="800" height="110" rx="14" fill="#0d0d10"/>
  <g class="p">
    <rect x="30" y="26" width="120" height="58" rx="29" fill="#171a21" stroke="#2b313e"/>
    <circle class="dot" cx="50" cy="55" r="4" fill="#dc2626"/>
    <text class="mono" x="98" y="59" text-anchor="middle" fill="#c9c9d4" font-size="10.5" letter-spacing=".6">MANIFEST V3</text>
  </g>
  <g class="p p2">
    <rect x="164" y="26" width="130" height="58" rx="29" fill="#171a21" stroke="#2b313e"/>
    <circle class="dot" cx="184" cy="55" r="4" fill="#dc2626"/>
    <text class="mono" x="235" y="59" text-anchor="middle" fill="#c9c9d4" font-size="10.5" letter-spacing=".6">VERSION 3.0.0</text>
  </g>
  <g class="p p3">
    <rect x="308" y="26" width="120" height="58" rx="29" fill="#171a21" stroke="#2b313e"/>
    <circle class="dot" cx="328" cy="55" r="4" fill="#dc2626"/>
    <text class="mono" x="372" y="59" text-anchor="middle" fill="#c9c9d4" font-size="10.5" letter-spacing=".6">CHROME / MV3</text>
  </g>
  <g class="p p4">
    <rect x="442" y="26" width="160" height="58" rx="29" fill="#171a21" stroke="#2b313e"/>
    <circle class="dot" cx="462" cy="55" r="4" fill="#dc2626"/>
    <text class="mono" x="530" y="59" text-anchor="middle" fill="#c9c9d4" font-size="10.5" letter-spacing=".6">0 NETWORK CALLS</text>
  </g>
  <g class="p p5">
    <rect x="616" y="26" width="154" height="58" rx="29" fill="#171a21" stroke="#2b313e"/>
    <circle class="dot" cx="636" cy="55" r="4" fill="#dc2626"/>
    <text class="mono" x="699" y="59" text-anchor="middle" fill="#c9c9d4" font-size="10.5" letter-spacing=".6">INDEXEDDB CACHE</text>
  </g>
</svg>
