<svg xmlns="http://www.w3.org/2000/svg" width="800" height="300" viewBox="0 0 800 300">
  <style>
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
    .txt { font-family: Inter, system-ui, -apple-system, sans-serif; }
    .orbit { animation: spin 12s linear infinite; transform-origin: 180px 150px; }
    .shield { animation: breathe 3.5s ease-in-out infinite; transform-origin: 180px 150px; }
    .check { stroke-dasharray: 90; animation: draw 12s ease-out infinite; }
    .copy { animation: fadeUp 12s ease-out infinite; }
    .c2 { animation-delay: .3s; }
    .c3 { animation-delay: .6s; }
    @keyframes spin { to { transform: rotate(360deg); } }
    @keyframes breathe { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.035); } }
    @keyframes draw { 0%, 10% { stroke-dashoffset: 90; } 25%, 90% { stroke-dashoffset: 0; } 100% { stroke-dashoffset: 90; } }
    @keyframes fadeUp { 0%, 5% { opacity: 0; transform: translateY(9px); } 15%, 90% { opacity: 1; transform: translateY(0); } 100% { opacity: 0; transform: translateY(0); } }
  </style>
  <rect width="800" height="300" rx="14" fill="#0d0d10"/>

  <g class="orbit">
    <circle cx="180" cy="150" r="118" fill="none" stroke="#2b313e" stroke-width="1.5" stroke-dasharray="3 8"/>
    <circle cx="298" cy="150" r="4" fill="#dc2626"/>
    <circle cx="62" cy="150" r="2.5" fill="#dc2626" fill-opacity=".6"/>
  </g>

  <g class="shield">
    <path d="M180 62 118 88v52c0 50 26 82 62 92 36-10 62-42 62-92V88l-62-26Z" fill="#dc2626" fill-opacity=".07" stroke="#dc2626" stroke-width="2.5" stroke-linejoin="round"/>
    <path class="check" d="m150 148 20 20 42-46" fill="none" stroke="#dc2626" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M140 96c10-5 26-11 40-15 14 4 30 10 40 15" fill="none" stroke="#dc2626" stroke-opacity=".35" stroke-width="1.5"/>
  </g>

  <g class="copy">
    <text class="txt" x="330" y="106" fill="#f7f7fb" font-size="34" font-weight="700" letter-spacing="-1">100% local</text>
    <text class="mono" x="332" y="138" fill="#dc2626" font-size="12" letter-spacing="2.4">NO NETWORK REQUESTS</text>
  </g>
  <g class="copy c2">
    <text class="txt" x="332" y="180" fill="#a5a5b3" font-size="13">Domains · Settings · Rules · Cleanup log</text>
    <text class="txt" x="332" y="204" fill="#a5a5b3" font-size="13">and cached history stay in this browser profile.</text>
  </g>
  <g class="copy c3">
    <rect x="330" y="232" width="308" height="32" rx="16" fill="#171a21" stroke="#2b313e"/>
    <circle cx="350" cy="248" r="3" fill="#dc2626"/>
    <text class="mono" x="492" y="252" text-anchor="middle" fill="#c9c9d4" font-size="9.5" letter-spacing=".8">NO SERVER · NO ANALYTICS · NO TELEMETRY</text>
  </g>
</svg>
