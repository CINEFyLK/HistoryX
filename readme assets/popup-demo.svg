<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500">
  <style>
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
    .txt { font-family: Inter, system-ui, -apple-system, sans-serif; }
    .head { animation: fadeUp 12s ease-out infinite; }
    .type { animation: type 12s linear infinite; transform-origin: left center; }
    .caret { animation: blink 1s steps(1) infinite; }
    .travel { animation: travel 3s ease-in-out infinite; }
    .travel2 { animation-delay: 1s; }
    .travel3 { animation-delay: 2s; }
    .toast { animation: toast 12s ease-in-out infinite; }
    .pulse { animation: soft 2.8s ease-in-out infinite; }
    @keyframes fadeUp {
      0%, 5% { opacity: 0; transform: translateY(9px); }
      15%, 90% { opacity: 1; transform: translateY(0); }
      100% { opacity: 0; transform: translateY(0); }
    }
    @keyframes type {
      0%, 8% { transform: scaleX(0); }
      22%, 90% { transform: scaleX(1); }
      100% { transform: scaleX(1); }
    }
    @keyframes blink { 0%, 49% { opacity: 1; } 50%, 100% { opacity: 0; } }
    @keyframes travel { 0% { opacity: 0; transform: translateX(0); } 15%, 75% { opacity: 1; } 95%, 100% { opacity: 0; transform: translateX(380px); } }
    @keyframes toast { 0%, 68% { opacity: 0; transform: translateY(8px); } 76%, 92% { opacity: 1; transform: translateY(0); } 100% { opacity: 0; } }
    @keyframes soft { 0%, 100% { opacity: .55; } 50% { opacity: 1; } }
  </style>
  <rect width="800" height="500" rx="14" fill="#0d0d10"/>

  <rect x="40" y="28" width="720" height="444" rx="12" fill="#111319" stroke="#2b313e"/>
  <path d="M40 62h720" stroke="#2b313e"/>
  <circle cx="60" cy="45" r="4" fill="#dc2626"/>
  <circle cx="78" cy="45" r="4" fill="#ffc46b"/>
  <circle cx="96" cy="45" r="4" fill="#5fd6a0"/>
  <rect x="124" y="36" width="470" height="18" rx="9" fill="#0d0d10"/>
  <text class="mono" x="138" y="49" fill="#757f92" font-size="9">chrome://extensions  ·  HistoryX</text>
  <text class="mono" x="730" y="49" fill="#757f92" font-size="10">···</text>

  <g class="head">
    <text class="mono" x="60" y="100" fill="#dc2626" font-size="11" letter-spacing="3">THE POPUP · LIVE VIEW</text>
    <text class="txt" x="60" y="138" fill="#f7f7fb" font-size="25" font-weight="700">See every visit.</text>
    <text class="txt" x="60" y="162" fill="#a5a5b3" font-size="12">Add a domain → preview exact URLs → clear.</text>

    <path d="M60 218H440" stroke="#2b313e" stroke-dasharray="4 5"/>
    <circle class="travel" cx="60" cy="218" r="3" fill="#dc2626"/>
    <text class="mono" x="60" y="207" fill="#a5a5b3" font-size="9.5">WINDOWED SCANNING</text>

    <path d="M60 282H440" stroke="#2b313e" stroke-dasharray="4 5"/>
    <circle class="travel travel2" cx="60" cy="282" r="3" fill="#dc2626"/>
    <text class="mono" x="60" y="271" fill="#a5a5b3" font-size="9.5">INDEXEDDB CACHE</text>

    <path d="M60 346H440" stroke="#2b313e" stroke-dasharray="4 5"/>
    <circle class="travel travel3" cx="60" cy="346" r="3" fill="#dc2626"/>
    <text class="mono" x="60" y="335" fill="#a5a5b3" font-size="9.5">LOCAL UNDO LOG</text>
  </g>

  <g class="toast">
    <rect x="60" y="394" width="300" height="46" rx="9" fill="#171a21" stroke="#3f6b56"/>
    <circle cx="84" cy="417" r="10" fill="#5fd6a0" fill-opacity=".14"/>
    <path d="m79 417 4 4 7-8" stroke="#5fd6a0" stroke-width="1.8" fill="none" stroke-linecap="round"/>
    <text class="txt" x="104" y="415" fill="#eef1f7" font-size="11.5">History cleared</text>
    <text class="mono" x="104" y="430" fill="#a6aebe" font-size="9">Restore available · Recent cleanups</text>
  </g>

  <rect x="456" y="74" width="284" height="380" rx="12" fill="#171a21" stroke="#2b313e"/>
  <rect x="476" y="92" width="24" height="24" rx="6" fill="#dc2626"/>
  <text class="txt" x="488" y="109" text-anchor="middle" fill="#fff" font-size="13" font-weight="700">H</text>
  <text class="txt" x="508" y="102" fill="#f7f7fb" font-size="14" font-weight="700">HistoryX</text>
  <text class="mono" x="508" y="115" fill="#a5a5b3" font-size="7.5" letter-spacing="1.5">BY CINEFYLK</text>
  <text class="mono" x="722" y="107" text-anchor="end" fill="#757f92" font-size="9">v3.0</text>

  <rect x="476" y="130" width="84" height="52" rx="8" fill="#1d212a"/>
  <text class="mono" x="486" y="146" fill="#757f92" font-size="7">DOMAINS</text>
  <text class="txt" x="486" y="171" fill="#f7f7fb" font-size="19" font-weight="700">4</text>
  <rect x="568" y="130" width="84" height="52" rx="8" fill="#1d212a"/>
  <text class="mono" x="578" y="146" fill="#757f92" font-size="7">MATCHING</text>
  <text class="txt" x="578" y="171" fill="#f7f7fb" font-size="19" font-weight="700">1,284</text>
  <rect x="660" y="130" width="60" height="52" rx="8" fill="#1d212a"/>
  <text class="mono" x="670" y="146" fill="#757f92" font-size="7">LAST</text>
  <text class="txt" x="670" y="171" fill="#f7f7fb" font-size="16" font-weight="700">09:41</text>

  <text class="txt" x="476" y="204" fill="#eef1f7" font-size="11" font-weight="600">Add a domain</text>
  <rect x="476" y="214" width="206" height="30" rx="6" fill="#0e1015" stroke="#2b313e"/>
  <g clip-path="url(#typeclip)">
    <text class="mono" x="488" y="234" fill="#eef1f7" font-size="11">youtube.com</text>
  </g>
  <clipPath id="typeclip"><rect class="type" x="486" y="218" width="86" height="20" fill="#fff"/></clipPath>
  <rect class="caret" x="558" y="223" width="1.5" height="12" fill="#dc2626"/>
  <rect x="688" y="214" width="32" height="30" rx="6" fill="#dc2626"/>
  <text class="txt" x="704" y="234" text-anchor="middle" fill="#fff" font-size="10" font-weight="650">Add</text>

  <rect x="476" y="258" width="244" height="42" rx="8" fill="#1d212a" stroke="#3a414f"/>
  <circle cx="494" cy="279" r="3" fill="#dc2626"/>
  <text class="txt" x="506" y="283" fill="#eef1f7" font-size="10.5">youtube.com</text>
  <text class="mono" x="710" y="283" text-anchor="end" fill="#a6aebe" font-size="8.5">412 visits</text>
  <rect class="pulse" x="476" y="308" width="244" height="42" rx="8" fill="#1d212a" stroke="#2b313e"/>
  <circle cx="494" cy="329" r="3" fill="#dc2626"/>
  <text class="txt" x="506" y="333" fill="#eef1f7" font-size="10.5">reddit.com</text>
  <text class="mono" x="710" y="333" text-anchor="end" fill="#a6aebe" font-size="8.5">236 visits</text>
  <rect x="476" y="358" width="244" height="42" rx="8" fill="#1d212a" stroke="#2b313e"/>
  <circle cx="494" cy="379" r="3" fill="#dc2626"/>
  <text class="txt" x="506" y="383" fill="#eef1f7" font-size="10.5">news.ycombinator.com</text>
  <text class="mono" x="710" y="383" text-anchor="end" fill="#a6aebe" font-size="8.5">98 visits</text>

  <rect class="pulse" x="476" y="412" width="244" height="28" rx="6" fill="#dc2626" fill-opacity=".13" stroke="#dc2626" stroke-opacity=".55"/>
  <text class="txt" x="598" y="430" text-anchor="middle" fill="#ff7a85" font-size="9.5" font-weight="600">Clean all managed history</text>
  <text class="mono" x="598" y="455" text-anchor="middle" fill="#757f92" font-size="7.5">100% LOCAL · NO NETWORK REQUESTS</text>
</svg>
