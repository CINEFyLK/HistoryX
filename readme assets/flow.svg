<svg xmlns="http://www.w3.org/2000/svg" width="800" height="340" viewBox="0 0 800 340">
  <style>
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
    .txt { font-family: Inter, system-ui, -apple-system, sans-serif; }
    .head { animation: fadeUp 12s ease-out infinite; }
    .step { animation: fadeUp 12s ease-out infinite; }
    .s2 { animation-delay: .3s; }
    .s3 { animation-delay: .6s; }
    .s4 { animation-delay: .9s; }
    .flow { stroke-dasharray: 5 6; animation: dash 1.6s linear infinite; }
    .lit { animation: lit 12s ease-in-out infinite; }
    .l2 { animation-delay: 3s; }
    .l3 { animation-delay: 6s; }
    .l4 { animation-delay: 9s; }
    @keyframes fadeUp {
      0%, 5% { opacity: 0; transform: translateY(9px); }
      15%, 90% { opacity: 1; transform: translateY(0); }
      100% { opacity: 0; transform: translateY(0); }
    }
    @keyframes dash { to { stroke-dashoffset: -22; } }
    @keyframes lit { 0%, 100% { opacity: 0; } 10%, 28% { opacity: 1; } }
  </style>
  <rect width="800" height="340" rx="14" fill="#0d0d10"/>
  <g class="head">
    <text class="mono" x="40" y="46" fill="#dc2626" font-size="12" letter-spacing="3">HOW IT WORKS</text>
    <text class="txt" x="40" y="78" fill="#f7f7fb" font-size="23" font-weight="700">Four steps, zero servers.</text>
  </g>

  <path class="flow" d="M220 196H228" stroke="#dc2626" stroke-width="2"/>
  <path class="flow" d="M396 196H404" stroke="#dc2626" stroke-width="2"/>
  <path class="flow" d="M572 196H580" stroke="#dc2626" stroke-width="2"/>

  <g class="step">
    <rect x="56" y="120" width="160" height="160" rx="12" fill="#171a21" stroke="#2b313e"/>
    <rect class="lit" x="56" y="120" width="160" height="160" rx="12" fill="none" stroke="#dc2626" stroke-width="2"/>
    <circle cx="80" cy="146" r="12" fill="#dc2626"/>
    <text class="mono" x="80" y="150" text-anchor="middle" fill="#fff" font-size="10">01</text>
    <path d="M136 164l18 30-8 2 4 10-7 3-4-10-6 6-3-30Z" fill="#dc2626" fill-opacity=".85"/>
    <text class="txt" x="136" y="240" text-anchor="middle" fill="#f7f7fb" font-size="13" font-weight="650">Right-click</text>
    <text class="mono" x="136" y="260" text-anchor="middle" fill="#a5a5b3" font-size="9">page or link</text>
  </g>

  <g class="step s2">
    <rect x="232" y="120" width="160" height="160" rx="12" fill="#171a21" stroke="#2b313e"/>
    <rect class="lit l2" x="232" y="120" width="160" height="160" rx="12" fill="none" stroke="#dc2626" stroke-width="2"/>
    <circle cx="256" cy="146" r="12" fill="#dc2626"/>
    <text class="mono" x="256" y="150" text-anchor="middle" fill="#fff" font-size="10">02</text>
    <rect x="290" y="163" width="44" height="42" rx="4" fill="none" stroke="#dc2626" stroke-width="1.8"/>
    <path d="M297 174h20M297 182h26M297 190h14" stroke="#dc2626" stroke-width="1.8" stroke-linecap="round"/>
    <text class="txt" x="312" y="240" text-anchor="middle" fill="#f7f7fb" font-size="13" font-weight="650">Preview</text>
    <text class="mono" x="312" y="260" text-anchor="middle" fill="#a5a5b3" font-size="9">exact URL list</text>
  </g>

  <g class="step s3">
    <rect x="408" y="120" width="160" height="160" rx="12" fill="#171a21" stroke="#2b313e"/>
    <rect class="lit l3" x="408" y="120" width="160" height="160" rx="12" fill="none" stroke="#dc2626" stroke-width="2"/>
    <circle cx="432" cy="146" r="12" fill="#dc2626"/>
    <text class="mono" x="432" y="150" text-anchor="middle" fill="#fff" font-size="10">03</text>
    <path d="M474 164h32M480 164v-6h20v6M503 164l-2 32h-24l-2-32M486 173v14M496 173v14" stroke="#dc2626" stroke-width="1.8" fill="none" stroke-linecap="round"/>
    <text class="txt" x="488" y="240" text-anchor="middle" fill="#f7f7fb" font-size="13" font-weight="650">Clear</text>
    <text class="mono" x="488" y="260" text-anchor="middle" fill="#a5a5b3" font-size="9">selected history</text>
  </g>

  <g class="step s4">
    <rect x="584" y="120" width="160" height="160" rx="12" fill="#171a21" stroke="#2b313e"/>
    <rect class="lit l4" x="584" y="120" width="160" height="160" rx="12" fill="none" stroke="#dc2626" stroke-width="2"/>
    <circle cx="608" cy="146" r="12" fill="#dc2626"/>
    <text class="mono" x="608" y="150" text-anchor="middle" fill="#fff" font-size="10">04</text>
    <path d="M676 164l-14 14h8c0 10 6 16 16 18-10-2-16-8-16-18" fill="none" stroke="#dc2626" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M662 178v-8a14 14 0 0 1 24-10l4 4" fill="none" stroke="#dc2626" stroke-width="1.8" stroke-linecap="round"/>
    <text class="txt" x="664" y="240" text-anchor="middle" fill="#f7f7fb" font-size="13" font-weight="650">Restore</text>
    <text class="mono" x="664" y="260" text-anchor="middle" fill="#a5a5b3" font-size="9">up to 500 URLs</text>
  </g>

  <text class="mono" x="40" y="314" fill="#757f92" font-size="10">PREVIEW FIRST · DELETE ONLY WHAT YOU SELECT · UNDO FROM RECENT CLEANUPS</text>
</svg>
