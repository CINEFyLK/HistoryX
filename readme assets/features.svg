<svg xmlns="http://www.w3.org/2000/svg" width="800" height="510" viewBox="0 0 800 510">
  <style>
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
    .txt { font-family: Inter, system-ui, -apple-system, sans-serif; }
    .card { transition: transform .35s ease; }
    .card:hover { transform: translateY(-4px); }
    .card:hover .box { stroke: #dc2626; }
    .card:hover .glow { opacity: .16; }
    .glow { opacity: 0; transition: opacity .35s ease; }
    .c1 { animation: fadeUp 12s ease-out infinite; animation-delay: .1s; }
    .c2 { animation: fadeUp 12s ease-out infinite; animation-delay: .3s; }
    .c3 { animation: fadeUp 12s ease-out infinite; animation-delay: .5s; }
    .c4 { animation: fadeUp 12s ease-out infinite; animation-delay: .7s; }
    .c5 { animation: fadeUp 12s ease-out infinite; animation-delay: .9s; }
    .c6 { animation: fadeUp 12s ease-out infinite; animation-delay: 1.1s; }
    .head { animation: fadeUp 12s ease-out infinite; }
    .bar { animation: draw 12s ease-out infinite; transform-origin: left center; }
    @keyframes fadeUp {
      0%, 5% { opacity: 0; transform: translateY(10px); }
      15%, 90% { opacity: 1; transform: translateY(0); }
      100% { opacity: 0; transform: translateY(0); }
    }
    @keyframes draw { 0%, 14% { transform: scaleX(0); } 24%, 90% { transform: scaleX(1); } 100% { transform: scaleX(0); } }
  </style>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d0d10"/>
      <stop offset="100%" stop-color="#0d0d10" stop-opacity=".85"/>
    </linearGradient>
  </defs>
  <rect width="800" height="510" rx="14" fill="url(#bg)"/>

  <g class="head">
    <text class="mono" x="40" y="46" fill="#dc2626" font-size="12" letter-spacing="3">BUILT FOR PRECISION</text>
    <text class="txt" x="40" y="82" fill="#f7f7fb" font-size="27" font-weight="700" letter-spacing="-.5">One extension. Total control.</text>
    <rect class="bar" x="40" y="94" width="236" height="2" fill="#dc2626"/>
  </g>

  <g class="card c1">
    <rect class="box" x="40" y="112" width="228" height="174" rx="12" fill="#15171d" stroke="#2b313e"/>
    <rect class="glow" x="40" y="112" width="228" height="174" rx="12" fill="#dc2626"/>
    <circle cx="68" cy="148" r="16" fill="#dc2626" fill-opacity=".13"/>
    <path d="M68 141v14M61 148h14" stroke="#dc2626" stroke-width="2" stroke-linecap="round"/>
    <text class="txt" x="94" y="152" fill="#f7f7fb" font-size="14" font-weight="650">Domain targeting</text>
    <text class="txt" x="60" y="192" fill="#a5a5b3" font-size="11.5">Root domains + every</text>
    <text class="txt" x="60" y="211" fill="#a5a5b3" font-size="11.5">subdomain. Lookalikes</text>
    <text class="txt" x="60" y="230" fill="#a5a5b3" font-size="11.5">like notyoutube.com</text>
    <text class="txt" x="60" y="249" fill="#a5a5b3" font-size="11.5">are never matched.</text>
  </g>

  <g class="card c2">
    <rect class="box" x="286" y="112" width="228" height="174" rx="12" fill="#15171d" stroke="#2b313e"/>
    <rect class="glow" x="286" y="112" width="228" height="174" rx="12" fill="#dc2626"/>
    <circle cx="314" cy="148" r="16" fill="#dc2626" fill-opacity=".13"/>
    <path d="M307 141l9 15 4-7 5-2-18-6Z" fill="#dc2626"/>
    <text class="txt" x="340" y="152" fill="#f7f7fb" font-size="14" font-weight="650">Context menu</text>
    <text class="txt" x="306" y="192" fill="#a5a5b3" font-size="11.5">Right-click any page</text>
    <text class="txt" x="306" y="211" fill="#a5a5b3" font-size="11.5">or link to add a site</text>
    <text class="txt" x="306" y="230" fill="#a5a5b3" font-size="11.5">or clear its history</text>
    <text class="txt" x="306" y="249" fill="#a5a5b3" font-size="11.5">without opening the popup.</text>
  </g>

  <g class="card c3">
    <rect class="box" x="532" y="112" width="228" height="174" rx="12" fill="#15171d" stroke="#2b313e"/>
    <rect class="glow" x="532" y="112" width="228" height="174" rx="12" fill="#dc2626"/>
    <circle cx="560" cy="148" r="16" fill="#dc2626" fill-opacity=".13"/>
    <path d="M553 142h14v12h-14z M556 139h8 M556 146h7 M556 150h5" stroke="#dc2626" stroke-width="1.6" fill="none" stroke-linecap="round"/>
    <text class="txt" x="586" y="152" fill="#f7f7fb" font-size="14" font-weight="650">URL preview</text>
    <text class="txt" x="552" y="192" fill="#a5a5b3" font-size="11.5">See the exact URL list</text>
    <text class="txt" x="552" y="211" fill="#a5a5b3" font-size="11.5">before deleting, then</text>
    <text class="txt" x="552" y="230" fill="#a5a5b3" font-size="11.5">select only the entries</text>
    <text class="txt" x="552" y="249" fill="#a5a5b3" font-size="11.5">you want removed.</text>
  </g>

  <g class="card c4">
    <rect class="box" x="40" y="304" width="228" height="174" rx="12" fill="#15171d" stroke="#2b313e"/>
    <rect class="glow" x="40" y="304" width="228" height="174" rx="12" fill="#dc2626"/>
    <circle cx="68" cy="340" r="16" fill="#dc2626" fill-opacity=".13"/>
    <circle cx="68" cy="340" r="9" fill="none" stroke="#dc2626" stroke-width="1.8"/>
    <path d="M68 340v-6 M68 340h5" stroke="#dc2626" stroke-width="1.8" stroke-linecap="round"/>
    <text class="txt" x="94" y="344" fill="#f7f7fb" font-size="14" font-weight="650">Rules engine</text>
    <text class="txt" x="60" y="384" fill="#a5a5b3" font-size="11.5">Startup, every N hours,</text>
    <text class="txt" x="60" y="403" fill="#a5a5b3" font-size="11.5">or daily at HH:MM.</text>
    <text class="txt" x="60" y="422" fill="#a5a5b3" font-size="11.5">Toggle rules without</text>
    <text class="txt" x="60" y="441" fill="#a5a5b3" font-size="11.5">deleting them.</text>
  </g>

  <g class="card c5">
    <rect class="box" x="286" y="304" width="228" height="174" rx="12" fill="#15171d" stroke="#2b313e"/>
    <rect class="glow" x="286" y="304" width="228" height="174" rx="12" fill="#dc2626"/>
    <circle cx="314" cy="340" r="16" fill="#dc2626" fill-opacity=".13"/>
    <ellipse cx="314" cy="336" rx="9" ry="3.5" fill="none" stroke="#dc2626" stroke-width="1.6"/>
    <path d="M305 336v8c0 2 4 3.5 9 3.5s9-1.5 9-3.5v-8" stroke="#dc2626" stroke-width="1.6" fill="none"/>
    <text class="txt" x="340" y="344" fill="#f7f7fb" font-size="14" font-weight="650">Large histories</text>
    <text class="txt" x="306" y="384" fill="#a5a5b3" font-size="11.5">Windowed scanning and</text>
    <text class="txt" x="306" y="403" fill="#a5a5b3" font-size="11.5">an IndexedDB cache keep</text>
    <text class="txt" x="306" y="422" fill="#a5a5b3" font-size="11.5">the popup fast, even with</text>
    <text class="txt" x="306" y="441" fill="#a5a5b3" font-size="11.5">huge profiles.</text>
  </g>

  <g class="card c6">
    <rect class="box" x="532" y="304" width="228" height="174" rx="12" fill="#15171d" stroke="#2b313e"/>
    <rect class="glow" x="532" y="304" width="228" height="174" rx="12" fill="#dc2626"/>
    <circle cx="560" cy="340" r="16" fill="#dc2626" fill-opacity=".13"/>
    <path d="M560 332l-7 3v6c0 5 3.4 8.2 7 9 3.6-.8 7-4 7-9v-6l-7-3Z" fill="none" stroke="#dc2626" stroke-width="1.6"/>
    <path d="m557 341 2 2 4-4" stroke="#dc2626" stroke-width="1.5" fill="none" stroke-linecap="round"/>
    <text class="txt" x="586" y="344" fill="#f7f7fb" font-size="14" font-weight="650">Private by design</text>
    <text class="txt" x="552" y="384" fill="#a5a5b3" font-size="11.5">No server, analytics or</text>
    <text class="txt" x="552" y="403" fill="#a5a5b3" font-size="11.5">external requests. Your</text>
    <text class="txt" x="552" y="422" fill="#a5a5b3" font-size="11.5">data stays in this</text>
    <text class="txt" x="552" y="441" fill="#a5a5b3" font-size="11.5">browser profile.</text>
  </g>
</svg>
